services:
  backend:
    build:
      context: .
      network: host
    volumes:
      - ./db:/usr/db
    networks:
      - backend

  ratelimit:
    image: nginx:1.29-alpine
    ports:
      - 3000:80
    networks:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

networks:
  backend: {}